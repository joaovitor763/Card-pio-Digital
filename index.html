<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital & Painel Admin</title>
    <!-- Tailwind CSS para Estilização Moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca QRCode.js para gerar os QR Codes das mesas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 p-2 rounded-xl text-slate-900 font-bold text-xl shadow">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 id="store-title" class="text-xl font-bold tracking-wide">Cardápio Digital</h1>
                    <span id="table-badge" class="inline-block bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded-full font-medium mt-0.5">
                        <i class="fa-solid fa-chair mr-1"></i>Mesa Geral
                    </span>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="chamarGarcom()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold px-4 py-2 rounded-xl text-sm transition shadow flex items-center space-x-2">
                    <i class="fa-solid fa-bell text-xs"></i>
                    <span class="hidden sm:inline">Chamar Garçom</span>
                </button>
                <button onclick="abrirLoginAdmin()" class="bg-slate-800 hover:bg-slate-700 text-gray-300 hover:text-white p-2.5 rounded-xl border border-slate-700 transition" title="Painel Administrativo">
                    <i class="fa-solid fa-lock text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
        
        <!-- Barra de Busca e Categorias -->
        <div class="mb-6 space-y-4">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" oninput="filtrarCardapio()" placeholder="O que você deseja pedir hoje?" 
                    class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
            </div>

            <!-- Filtros de Categoria -->
            <div id="category-filters" class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="filtrarCategoria('todos')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition bg-slate-900 text-white shadow">
                    Todos
                </button>
            </div>
        </div>

        <!-- Grade de Produtos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
            <!-- Os produtos serão injetados dinamicamente via JS -->
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-white border-t border-gray-100 py-4 mt-12 text-center text-xs text-gray-400">
        <p>&copy; 2026 Cardápio Digital Inteligente. Todos os direitos reservados.</p>
    </footer>

    <!-- MODAL DE LOGIN ADMIN -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl animate-scale">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900"><i class="fa-solid fa-lock text-amber-500 mr-2"></i>Área Administrativa</h3>
                <button onclick="fecharModal('login-modal')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-gray-500 mb-4">Digite a senha de administrador para gerenciar o cardápio, preços e mesas.</p>
            <input type="password" id="admin-password-input" autocomplete="current-password" placeholder="Senha de administrador" class="w-full px-4 py-3 border border-gray-200 rounded-xl mb-4 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
            <button onclick="fazerLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-medium text-sm transition shadow">
                Entrar no Painel
            </button>
        </div>
    </div>

    <!-- PAINEL ADMINISTRATIVO (MODAL GRANDE) -->
    <div id="admin-panel" class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm z-50 hidden flex flex-col">
        <div class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-sliders text-amber-500"></i>
                <h2 class="font-bold text-lg">Painel de Controle do Administrador</h2>
            </div>
            <button onclick="fecharPainelAdmin()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-sm transition">
                <i class="fa-solid fa-xmark mr-1"></i> Fechar Painel
            </button>
        </div>

        <div class="flex-grow overflow-y-auto p-4 md:p-6 max-w-6xl mx-auto w-full space-y-6">
            
            <!-- Abas do Admin -->
            <div class="flex space-x-2 border-b border-gray-800 pb-3">
                <button onclick="mudarTabAdmin('produtos')" id="btn-tab-produtos" class="px-4 py-2 rounded-xl text-sm font-semibold bg-amber-500 text-slate-900 transition">Gerenciar Produtos</button>
                <button onclick="mudarTabAdmin('mesas')" id="btn-tab-mesas" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800 text-gray-300 transition">Gerador de QR Code (Mesas)</button>
                <button onclick
